name: Ollama Service

on:
  workflow_dispatch:

jobs:
  run-ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Instalar Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Iniciar Ollama y descargar modelo
        run: |
          ollama serve &
          sleep 10
          ollama pull phi3

      - name: Exponer puerto con Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          ngrok authtoken $NGROK_AUTHTOKEN
          ngrok http 11434 --log=stdout &
          
          echo "Esperando URL de Ngrok..."
          sleep 6
          echo "=========================================="
          echo "COPIÁ LA URL DE ABAJO PARA TU BOT EN FPS.MS:"
          curl -s http://localhost:4040/api/tunnels | grep -o 'https://[^"]*ngrok[^"]*' || true
          echo "=========================================="
          
          sleep infinity
