- name: Exponer puerto con Localtunnel
        run: 
          # Instalar localtunnel (requiere Node.js que ya viene en ubuntu-latest)
          npm install -g localtunnel
          
          # Lanzar el túnel en segundo plano
          lt --port 11434 > localtunnel.log 2>&1 &
          
          # Esperar a que genere la URL y mostrarla en pantalla
          echo "Esperando URL de Localtunnel..."
          sleep 6
          echo "=========================================="
          echo "COPIÁ LA URL DE ABAJO PARA TU BOT EN FPS.MS:"
          cat localtunnel.log
          echo "=========================================="
          
          # Mantener el workflow vivo
          sleep infinity
