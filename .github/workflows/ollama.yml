name: Ollama Service

on:
  workflow_dispatch:

jobs:
  run-ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Instalar Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Iniciar Ollama y descargar modelo
        run: |
          ollama serve &
          sleep 10
          ollama pull phi3

      - name: Exponer puerto con Serveo
        run: |
          ssh -o StrictHostKeyChecking=no -R 80:localhost:11434 serveo.net > serveo.log 2>&1 &
          
          echo "Esperando URL de Serveo..."
          sleep 6
          echo "=========================================="
          echo "COPIÁ LA URL DE ABAJO PARA TU BOT EN FPS.MS:"
          cat serveo.log | grep -o 'https://[-0-9a-z]*\.serveo.net' || true
          echo "=========================================="
          
          sleep infinity
