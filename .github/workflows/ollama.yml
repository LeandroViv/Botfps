name: Ollama Service

on:
  workflow_dispatch:

jobs:
  run-ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Instalar Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Iniciar Ollama y descargar modelo
        run: |
          ollama serve &
          sleep 15
          ollama pull phi3

      - name: Exponer puerto con Pinggy
        run: |
          ssh -p 443 -o StrictHostKeyChecking=no -R 0:localhost:11434 a.pinggy.io > pinggy.log 2>&1 &
          
          echo "Esperando URL de Pinggy..."
          sleep 8
          echo "=========================================="
          echo "COPIÁ LA URL DE ABAJO PARA TU BOT EN FPS.MS:"
          cat pinggy.log | grep -o 'https://[-0-9a-z]*\.pinggy.link' || true
          echo "=========================================="
          
          sleep infinity
